name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
        id: pages
      - name: Install image optimizer
        run: pip install --quiet pillow
      - name: Build static site
        run: python build.py --site-url "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Ping IndexNow
        run: |
          sleep 20
          SITE="${{ steps.deployment.outputs.page_url }}"
          KEY="09179b15a8c42e416cc7712b095079b1"
          URLS=$(curl -s "${SITE}sitemap.xml" | grep -oP '(?<=<loc>)[^<]+' | jq -R . | jq -s -c .)
          curl -s -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"maktaba-warraqa.github.io\",\"key\":\"$KEY\",\"keyLocation\":\"${SITE}$KEY.txt\",\"urlList\":$URLS}"
