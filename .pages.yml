# Pages CMS (https://app.pagescms.org) : interface d'édition du site.
# Chaque enregistrement crée un commit sur main, le site se reconstruit tout seul (1 minute).
media:
  input: assets/blog
  output: /assets/blog
  extensions: [jpg, jpeg, png, webp]
content:
  - name: blog
    label: "Blog / المدونة"
    description: "Un article = une langue. Pour publier le même sujet en arabe, créez un second article."
    type: collection
    path: content/blog
    format: json
    filename: "{year}-{month}-{day}-{fields.slug}.json"
    view:
      fields: [titre, langue, date, brouillon]
      primary: titre
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - { name: titre, label: "Titre de l'article / العنوان", type: string, required: true, description: "Clair et précis, avec le service et Batna si possible. Ex. : Comment imprimer un plan A0 à Batna" }
      - { name: slug, label: "Adresse de la page", type: string, required: true, pattern: { regex: "^[a-z0-9]+(-[a-z0-9]+)*$", message: "Lettres minuscules sans accents, chiffres et tirets. Ex. : imprimer-plan-a0-batna" }, description: "Lettres latines minuscules et tirets, même pour un article en arabe. Ne plus la changer après publication." }
      - name: langue
        label: "Langue / اللغة"
        type: select
        required: true
        default: fr
        options:
          values:
            - { value: fr, label: "Français" }
            - { value: ar, label: "العربية" }
            - { value: en, label: "English" }
      - name: service
        label: "Service lié (l'article s'affichera sur sa page) / الخدمة"
        type: select
        options:
          values:
            - { value: print, label: "Impression et photocopie" }
            - { value: largeformat, label: "Grand format / plans architectes" }
            - { value: reports, label: "Mémoires et rapports" }
            - { value: school, label: "Écoles et lycées" }
            - { value: digital, label: "Services digitaux et IA" }
            - { value: shopping, label: "Achats en ligne" }
      - { name: date, label: "Date / التاريخ", type: date, required: true }
      - { name: resume, label: "Résumé (affiché dans Google, 155 caractères max) / ملخص", type: text, required: true, options: { maxlength: 160 } }
      - { name: image, label: "Image principale (facultatif) / صورة", type: image, description: "Photo horizontale de préférence. Elle est réduite automatiquement." }
      - { name: contenu, label: "Contenu de l'article / المحتوى", type: rich-text, required: true, options: { format: html } }
      - { name: brouillon, label: "Brouillon (cocher pour ne pas publier) / مسودة", type: boolean, default: false }
  - name: boutique
    label: "Boutique : téléphone, adresse, horaires / المحل"
    type: file
    path: content/boutique.json
    format: json
    fields:
      - { name: telephone, label: "Téléphone (aussi utilisé pour WhatsApp) / الهاتف", type: string, required: true, description: "Format 0773 58 99 54. Si vous le changez, changez-le aussi dans les textes et les FAQ." }
      - { name: rue, label: "Rue / الشارع", type: string, required: true }
      - { name: ville, label: "Ville / المدينة", type: string, required: true }
      - { name: code_postal, label: "Code postal", type: string, required: true }
      - { name: google_maps, label: "Lien Google Maps", type: string, required: true }
      - name: horaires
        label: "Horaires pour Google (données techniques) / أوقات العمل"
        description: "Heures au format 07:30 et 21:00. Pensez aussi à modifier les horaires affichés dans chaque langue."
        type: object
        list: true
        fields:
          - name: jours
            label: "Jours / الأيام"
            type: select
            required: true
            options:
              multiple: true
              values:
                - { value: Saturday, label: "Samedi / السبت" }
                - { value: Sunday, label: "Dimanche / الأحد" }
                - { value: Monday, label: "Lundi / الإثنين" }
                - { value: Tuesday, label: "Mardi / الثلاثاء" }
                - { value: Wednesday, label: "Mercredi / الأربعاء" }
                - { value: Thursday, label: "Jeudi / الخميس" }
                - { value: Friday, label: "Vendredi / الجمعة" }
          - { name: ouverture, label: "Ouverture (ex. 07:30) / الفتح", type: string, required: true, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
          - { name: fermeture, label: "Fermeture (ex. 21:00) / الغلق", type: string, required: true, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
  - name: textes_fr
    label: "Textes en français / النصوص بالفرنسية"
    type: file
    path: content/fr.json
    format: json
    fields:
      - { name: adresse_complete, label: "Adresse affichée / العنوان", type: string, required: true }
      - name: horaires_affiches
